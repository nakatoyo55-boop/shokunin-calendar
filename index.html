<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>現場スケジュール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root {
    --primary:#1a5c3a;--primary-light:#e8f5ee;--primary-mid:#2d8a58;
    --accent:#f0a500;--danger:#c0392b;--danger-light:#fdecea;
    --cont:#1a6fa8;--cont-light:#e8f1fa;
    --text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--bg:#f4f6f4;--card:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .app-wrapper{max-width:900px;margin:0 auto;}
  .app-header{background:var(--primary);color:white;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;gap:8px;}
  .store-badge{background:var(--accent);color:#1a1a00;font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px;white-space:nowrap;}
  .store-badge.admin{background:#e74c3c;color:white;}
  .worker-display{font-size:18px;font-weight:700;flex:1;text-align:center;}
  .sync-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .sync-btn:hover{background:rgba(255,255,255,.25);}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:24px;padding:6px 20px 12px;}
  .nav-arrow{background:rgba(255,255,255,.15);border:none;color:white;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .nav-arrow:hover{background:rgba(255,255,255,.25);}
  .month-title{font-size:20px;font-weight:700;letter-spacing:1px;min-width:160px;text-align:center;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);background:#13472d;}
  .wd{text-align:center;padding:6px 0;font-size:12px;font-weight:500;color:rgba(255,255,255,.7);}
  .wd.sun{color:#f8a5a0;}.wd.sat{color:#a0c8f8;}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:2px;background:var(--border);}
  .day-cell{background:var(--card);min-height:72px;padding:4px 3px 3px;cursor:pointer;position:relative;transition:background .15s;border-radius:3px;overflow:hidden;}
  @media(min-width:600px){.day-cell{min-height:96px;padding:6px 6px 4px;}.day-num{font-size:14px !important;width:26px !important;height:26px !important;}.etag{font-size:11px !important;padding:2px 6px !important;}}
  @media(min-width:900px){.day-cell{min-height:120px;padding:8px 8px 6px;}.day-num{font-size:15px !important;width:28px !important;height:28px !important;}.etag{font-size:12px !important;}}
  .day-cell:hover{background:#f5f9f5;}.day-cell.other-month{background:#f8f9f8;cursor:default;}.day-cell.other-month:hover{background:#f8f9f8;}
  .day-cell.today{background:#f0faf4;}.day-cell.today::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary-mid);border-radius:3px 3px 0 0;}
  .day-cell.has-event{border-top:3px solid var(--primary-mid);}.day-cell.has-cont{border-top:3px solid var(--cont);}.day-cell.has-off{border-top:3px solid var(--danger);}
  .day-num{font-size:12px;font-weight:500;color:var(--text);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px;}
  .day-num.sun{color:var(--danger);}.day-num.sat{color:#1a5c8a;}.day-cell.other-month .day-num{color:#bbb;}.day-cell.today .day-num{background:var(--primary);color:white !important;font-weight:700;}
  .etag{font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.6;display:block;}
  .tw{background:var(--primary-light);color:var(--primary);}.tc{background:var(--cont-light);color:var(--cont);}.to{background:var(--danger-light);color:var(--danger);}.ts{background:#f3f4f6;color:#555;}.tp{background:#fff3cd;color:#856404;font-weight:700;}
  .legend{display:flex;gap:16px;padding:10px 16px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .ldot{width:10px;height:10px;border-radius:2px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.show{opacity:1;pointer-events:all;}
  .modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;padding:0 0 40px;max-height:80vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.34,1.2,.64,1);}
  .overlay.show .modal{transform:translateY(0);}
  @media(min-width:600px){.overlay{align-items:center;}.modal{border-radius:16px;max-width:520px;max-height:85vh;transform:scale(.95);transition:transform .22s ease,opacity .2s;opacity:0;}.overlay.show .modal{transform:scale(1);opacity:1;}}
  .modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
  .modal-header{padding:20px 24px 14px;border-bottom:1px solid var(--border);}
  .modal-date-lbl{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .modal-client{font-size:22px;font-weight:700;color:var(--primary);}.modal-client.off{color:var(--danger);}
  .modal-body{padding:16px 24px;}
  .frow{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start;}
  .ficon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:2px;}
  .fi-c{background:var(--primary-light);}.fi-p{background:#e8f1fa;}.fi-w{background:#fff8e6;}.fi-m{background:#f3f4f6;}
  .fi-inner{flex:1;}
  .flbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
  .fval{font-size:16px;color:var(--text);font-weight:500;line-height:1.5;}.fval.empty{color:#ccc;font-weight:400;font-size:14px;}
  .close-btn{margin:8px 24px 0;width:calc(100% - 48px);padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  .no-event{text-align:center;padding:24px 0 8px;color:var(--muted);font-size:14px;}
  .setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:var(--bg);}
  .setup-card{background:var(--card);border-radius:16px;padding:32px 28px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
  .setup-title{font-size:22px;font-weight:700;margin-bottom:6px;color:var(--primary);}
  .setup-desc{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.7;}
  .fg{margin-bottom:18px;}
  .flabel{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;display:block;}
  .sel-wrap{position:relative;}.sel-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:13px;}
  select{width:100%;padding:12px 36px 12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);background:#fafafa;outline:none;appearance:none;cursor:pointer;}
  select:focus{border-color:var(--primary-mid);background:white;}
  .start-btn{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;transition:opacity .2s;}
  .start-btn:hover:not(:disabled){opacity:.9;}.start-btn:disabled{opacity:.4;cursor:default;}
  .loading-wrap{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-txt{font-size:14px;color:var(--muted);}
  .footer-link{text-align:center;padding:12px 0 28px;}
  .footer-link button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;}
  #adminWorkerSelect{display:none;flex:1;margin:0 8px;padding:6px 10px;border-radius:8px;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.95);color:#1a1a2e;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;outline:none;}
</style>
</head>
<body>

<div class="loading-wrap" id="loadingWrap" style="display:none">
  <div class="spinner"></div>
  <div class="loading-txt" id="loadingTxt">読み込み中...</div>
</div>

<!-- セットアップ画面 -->
<div id="setupScreen" class="setup">
  <div class="setup-card">
    <div class="setup-title" id="setupTitle">📋 現場スケジュール</div>
    <div class="setup-desc" id="setupDesc">職人名を選択してください。<br><small>※ 設定はこの端末に記憶されます</small></div>
    <div class="fg">
      <label class="flabel">職人名を選択</label>
      <div class="sel-wrap">
        <select id="workerSelect"><option value="">読み込み中...</option></select>
      </div>
    </div>
    <button class="start-btn" id="startBtn" onclick="startApp()" disabled>開始する</button>
  </div>
</div>

<!-- メインアプリ -->
<div id="mainApp" style="display:none">
  <div class="app-header">
    <div class="app-wrapper">
      <div class="header-top">
        <div class="store-badge" id="storeBadge">現場</div>
        <div class="worker-display" id="workerDisplay"></div>
        <select id="adminWorkerSelect" onchange="switchWorker(this.value)"></select>
        <button class="sync-btn" onclick="loadSchedule()">↻ 更新</button>
      </div>
      <div class="month-nav">
        <button class="nav-arrow" onclick="changeMonth(-1)">‹</button>
        <div class="month-title" id="monthTitle"></div>
        <button class="nav-arrow" onclick="changeMonth(1)">›</button>
      </div>
      <div class="weekday-row">
        <div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div>
        <div class="wd">水</div><div class="wd">木</div><div class="wd">金</div><div class="wd sat">土</div>
      </div>
    </div>
  </div>
  <div class="app-wrapper">
    <div class="calendar-grid" id="calGrid"></div>
    <div class="legend">
      <div class="legend-item"><div class="ldot" style="background:var(--primary-mid)"></div>作業あり</div>
      <div class="legend-item"><div class="ldot" style="background:var(--cont)"></div>継続作業</div>
      <div class="legend-item"><div class="ldot" style="background:var(--danger)"></div>休み</div>
    </div>
    <div class="footer-link" id="footerLink" style="display:none">
      <button onclick="showWorkerUrls()" id="urlListBtn" style="background:var(--primary);color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px;">📋 職人別URL一覧</button><br>
      <button onclick="showSetup()">職人を変更する</button>
    </div>
  </div>
</div>

<!-- 詳細モーダル -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-date-lbl" id="modalDate"></div>
      <div class="modal-client" id="modalClient"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <button class="close-btn" onclick="closeModalDirect()">閉じる</button>
  </div>
</div>

<script>
// ===== URLパラメータを取得（GitHub Pages上で動作） =====
var params   = new URLSearchParams(window.location.search);
var GAS_URL  = params.get('gas')    || '';
var WORKER_ID = params.get('worker') || '';
var PW        = params.get('pw')     || '';
var IS_ADMIN  = false; // GASから取得後に更新

var cy, cm, events = {}, cfg = {};
var MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
var WDAYS  = ['日','月','火','水','木','金','土'];

// ===== 初期化 =====
window.onload = function() {
  var now = new Date();
  cy = now.getFullYear();
  cm = now.getMonth() + 1;

  if (!GAS_URL) {
    alert('URLにGAS URLが設定されていません。\n管理者にお問い合わせください。');
    return;
  }

  // GASにモード確認（JSONPで通信）
  callGAS('getConfig', { pw: PW, worker: WORKER_ID }, function(config) {
    IS_ADMIN  = config.isAdmin  || false;
    var wid   = config.workerId || WORKER_ID || '';

    if (wid && !IS_ADMIN) {
      cfg = { workerId: wid };
      launchApp();
      return;
    }
    if (IS_ADMIN) {
      var saved = localStorage.getItem('sk_cfg_admin');
      if (saved) { cfg = JSON.parse(saved); launchApp(); return; }
    }
    initSetup();
  });
};

// ===== JSONP通信（GASのfetch制限を回避） =====
function callGAS(action, params, callback) {
  var cbName = '_cb_' + Date.now();
  var old = document.getElementById('_gasScript');
  if (old) old.remove();

  window[cbName] = function(data) {
    delete window[cbName];
    document.getElementById('_gasScript').remove();
    callback(data);
  };

  var url = GAS_URL + '?callback=' + cbName + '&action=' + action;
  for (var k in params) {
    if (params[k]) url += '&' + k + '=' + encodeURIComponent(params[k]);
  }

  var s = document.createElement('script');
  s.id = '_gasScript';
  s.src = url;
  s.onerror = function() {
    delete window[cbName];
    hideLoading();
    alert('GASへの接続に失敗しました。');
  };
  document.body.appendChild(s);
}

// ===== セットアップ =====
function initSetup() {
  if (IS_ADMIN) {
    document.getElementById('setupTitle').textContent = '⚙️ 管理者モード';
    document.getElementById('setupDesc').innerHTML = '閲覧する職人を選択してください。<br><small>※ 全職人のスケジュールを参照できます</small>';
  }
  showLoading('職人情報を取得中...');
  callGAS('getWorkers', {}, function(workers) {
    hideLoading();
    var sel = document.getElementById('workerSelect');
    sel.innerHTML = '<option value="">職人を選んでください</option>';
    workers.forEach(function(w) {
      var opt = document.createElement('option');
      opt.value = w.id; opt.textContent = w.name;
      sel.appendChild(opt);
    });
    sel.onchange = function() {
      document.getElementById('startBtn').disabled = !sel.value;
    };
  });
}

function startApp() {
  var workerId = document.getElementById('workerSelect').value;
  if (!workerId) return;
  if (IS_ADMIN) {
    cfg = { workerId: workerId };
    localStorage.setItem('sk_cfg_admin', JSON.stringify(cfg));
  } else {
    cfg = { workerId: workerId };
  }
  launchApp();
}

function launchApp() {
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';

  if (IS_ADMIN) {
    var badge = document.getElementById('storeBadge');
    badge.textContent = '管理者';
    badge.classList.add('admin');
    document.getElementById('workerDisplay').style.display = 'none';
    document.getElementById('adminWorkerSelect').style.display = 'block';
    document.getElementById('footerLink').style.display = 'block';

    // ドロップダウンに職人一覧を読み込む
    callGAS('getWorkers', {}, function(workers) {
      var sel = document.getElementById('adminWorkerSelect');
      sel.innerHTML = '';
      workers.forEach(function(w) {
        var opt = document.createElement('option');
        opt.value = w.id; opt.textContent = w.name;
        if (w.id === cfg.workerId) opt.selected = true;
        sel.appendChild(opt);
      });
      if (!cfg.workerId && workers.length > 0) {
        cfg.workerId = workers[0].id;
      }
      loadSchedule();
    });
  } else {
    document.getElementById('workerDisplay').style.display = 'block';
    document.getElementById('adminWorkerSelect').style.display = 'none';
    document.getElementById('footerLink').style.display = 'none';
    loadSchedule();
  }
}

function showSetup() {
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'flex';
  localStorage.removeItem('sk_cfg_admin');
  initSetup();
}

function switchWorker(workerId) {
  if (!workerId) return;
  cfg.workerId = workerId;
  localStorage.setItem('sk_cfg_admin', JSON.stringify(cfg));
  loadSchedule();
}

// ===== スケジュール取得 =====
function loadSchedule() {
  showLoading('スケジュール取得中...');
  callGAS('getSchedule', { worker: cfg.workerId }, function(res) {
    hideLoading();
    if (res.error) { alert('エラー: ' + res.error); return; }
    events = {};
    (res.events || []).forEach(function(ev) { events[ev.date] = ev; });
    if (res.worker) {
      cfg.workerName = res.worker;
      document.getElementById('workerDisplay').textContent = res.worker;
      document.getElementById('storeBadge').textContent = res.store || '現場';
    }
    renderCal();
  });
}

// ===== カレンダー描画 =====
function renderCal() {
  document.getElementById('monthTitle').textContent = cy + '年 ' + MONTHS[cm-1];
  var grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  var first   = new Date(cy, cm-1, 1).getDay();
  var dim     = new Date(cy, cm, 0).getDate();
  var prevDim = new Date(cy, cm-1, 0).getDate();
  var today   = new Date();

  var cells = [];
  for (var i = first-1; i >= 0; i--) cells.push({ d: prevDim-i, cur: false });
  for (var d = 1; d <= dim; d++) cells.push({ d: d, cur: true });
  while (cells.length % 7 !== 0) cells.push({ d: cells.length-dim-first+1, cur: false });

  cells.forEach(function(item, idx) {
    var col  = idx % 7;
    var cell = document.createElement('div');
    cell.className = 'day-cell' + (item.cur ? '' : ' other-month');

    var ev = null;
    if (item.cur) {
      var key = cy + '-' + pad(cm) + '-' + pad(item.d);
      ev = events[key] || null;
      var isToday = today.getFullYear()===cy && today.getMonth()===cm-1 && today.getDate()===item.d;
      if (isToday) cell.classList.add('today');
      if (ev) {
        var c = ev.client || '';
        if (isOff(c)) cell.classList.add('has-off');
        else if (isCont(c)) cell.classList.add('has-cont');
        else if (c) cell.classList.add('has-event');
        (function(d, e, k){ cell.onclick = function(){ openModal(d, e, k); }; })(item.d, ev, key);
      } else if (!IS_ADMIN) {
        (function(d, k){ cell.onclick = function(){ openModal(d, null, k); }; })(item.d, key);
      }
    }

    var num = document.createElement('div');
    num.className = 'day-num' + (col===0 ? ' sun' : col===6 ? ' sat' : '');
    num.textContent = item.d;
    cell.appendChild(num);

    if (ev) {
      var c = ev.client || '';
      if (isOff(c)) cell.appendChild(makeTag('休み','to'));
      else if (isCont(c)) cell.appendChild(makeTag('→継続','tc'));
      else {
        if (c) cell.appendChild(makeTag(c,'tw'));
        if (ev.content) cell.appendChild(makeTag(ev.content,'ts'));
        if (ev.memo && ev.memo.indexOf('予定あり') !== -1) cell.appendChild(makeTag('🔒予定あり','tp'));
      }
    }
    grid.appendChild(cell);
  });
}

function pad(n){ return String(n).padStart(2,'0'); }
function makeTag(t,c){ var e=document.createElement('span'); e.className='etag '+c; e.textContent=t; return e; }
function isOff(c){ return ['×','x','✕','ｘ'].indexOf(c) !== -1; }
function isCont(c){ return c==='→'; }

// ===== モーダル =====
function openModal(day, ev, dateKey) {
  var d = new Date(cy, cm-1, day);
  document.getElementById('modalDate').textContent = cy+'年 '+MONTHS[cm-1]+' '+day+'日（'+WDAYS[d.getDay()]+'）';

  var c = ev ? (ev.client||'').trim() : '';
  var off = isOff(c), cont = isCont(c);
  var hasMemo = ev && ev.memo && ev.memo.indexOf('予定あり') !== -1;

  var clientEl = document.getElementById('modalClient');
  clientEl.textContent = off ? '本日は休みです' : cont ? '前日からの継続作業' : (c || '予定なし');
  clientEl.className = 'modal-client' + (off ? ' off' : '');

  var html = '';
  if (off || cont) {
    html = ev && ev.memo
      ? '<div class="frow"><div class="ficon fi-m">📝</div><div class="fi-inner"><div class="flbl">メモ</div><div class="fval">'+ev.memo+'</div></div></div>'
      : '<div class="no-event">'+(off?'休日です':'前日からの作業が続いています')+'</div>';
  } else {
    if (ev) {
      var fields = [
        {icon:'🏢',cls:'fi-c',lbl:'得意先',val:ev.client},
        {icon:'📍',cls:'fi-p',lbl:'場所・現場',val:ev.place},
        {icon:'🔧',cls:'fi-w',lbl:'作業内容',val:ev.content},
        {icon:'📝',cls:'fi-m',lbl:'メモ・備考',val:ev.memo}
      ];
      fields.forEach(function(f){
        html += '<div class="frow"><div class="ficon '+f.cls+'">'+f.icon+'</div><div class="fi-inner"><div class="flbl">'+f.lbl+'</div><div class="fval'+(f.val?'':' empty')+'">'+(f.val||'未入力')+'</div></div></div>';
      });
    } else {
      html = '<div class="no-event">この日は現場の予定がありません</div>';
    }
    if (!IS_ADMIN) {
      if (hasMemo) {
        html += '<div style="margin-top:12px;padding:10px 14px;background:#fff3cd;border-radius:10px;font-size:14px;color:#856404;font-weight:700;">🔒 この日は予定ありと登録済みです</div>';
        html += '<button onclick="cancelYotei(\''+dateKey+'\')" style="margin-top:10px;width:100%;padding:12px;background:#f8f9fa;border:1.5px solid #dee2e6;border-radius:10px;font-size:14px;color:#6c757d;font-family:inherit;cursor:pointer;">予定を取り消す</button>';
      } else {
        html += '<button onclick="registerYotei(\''+dateKey+'\')" style="margin-top:12px;width:100%;padding:14px;background:#f0a500;color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;">🙋 この日は予定ありで登録する</button>';
      }
    }
  }
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}

function closeModal(e){ if(e.target===document.getElementById('overlay')) closeModalDirect(); }
function closeModalDirect(){ document.getElementById('overlay').classList.remove('show'); }

// ===== 予定あり登録 =====
function registerYotei(dateKey) {
  showLoading('登録中...');
  callGAS('writeMemo', { worker: cfg.workerId, date: dateKey, memo: '予定あり' }, function(res) {
    hideLoading();
    closeModalDirect();
    if (!events[dateKey]) events[dateKey] = { client:'', place:'', content:'', memo:'' };
    events[dateKey].memo = '予定あり';
    renderCal();
    showToast('✅ 登録しました');
  });
}

function cancelYotei(dateKey) {
  if (!confirm('予定ありの登録を取り消しますか？')) return;
  showLoading('取り消し中...');
  callGAS('writeMemo', { worker: cfg.workerId, date: dateKey, memo: '' }, function(res) {
    hideLoading();
    closeModalDirect();
    if (events[dateKey]) events[dateKey].memo = '';
    renderCal();
    showToast('🗑 取り消しました');
  });
}

// ===== 管理者：職人別URL =====
function showWorkerUrls() {
  showLoading('URL生成中...');
  callGAS('getWorkers', {}, function(workers) {
    hideLoading();
    var base = window.location.href.split('?')[0];
    var html = '<div style="padding:4px 0">';
    html += '<p style="font-size:12px;color:#6b7280;margin-bottom:16px;">各URLを職人のLINEなどで送ってください。</p>';
    workers.forEach(function(w) {
      var url = base + '?gas=' + encodeURIComponent(GAS_URL) + '&worker=' + encodeURIComponent(w.id);
      html += '<div style="margin-bottom:12px;padding:12px;background:#f4f6f4;border-radius:10px;">';
      html += '<div style="font-weight:700;font-size:14px;margin-bottom:6px;">👷 '+w.name+'</div>';
      html += '<div style="font-size:11px;word-break:break-all;color:#1a6fa8;background:white;padding:8px;border-radius:6px;border:1px solid #e5e7eb;">'+url+'</div>';
      html += '<button onclick="copyUrl(\''+url+'\',this)" style="margin-top:6px;padding:5px 12px;background:#1a5c3a;color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;">コピー</button>';
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('modalDate').textContent = '';
    document.getElementById('modalClient').textContent = '職人別URL一覧';
    document.getElementById('modalClient').className = 'modal-client';
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('overlay').classList.add('show');
  });
}

function copyUrl(url, btn) {
  navigator.clipboard.writeText(url).then(function(){
    btn.textContent = '✅ コピー済み';
    setTimeout(function(){ btn.textContent = 'コピー'; }, 2000);
  }).catch(function(){
    var el = document.createElement('textarea');
    el.value = url; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    btn.textContent = '✅ コピー済み';
    setTimeout(function(){ btn.textContent = 'コピー'; }, 2000);
  });
}

function changeMonth(dir) {
  cm += dir;
  if (cm > 12){ cm = 1; cy++; }
  if (cm < 1) { cm = 12; cy--; }
  loadSchedule();
}

function showLoading(msg){ document.getElementById('loadingTxt').textContent = msg; document.getElementById('loadingWrap').style.display = 'flex'; }
function hideLoading(){ document.getElementById('loadingWrap').style.display = 'none'; }

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:20px;font-size:14px;z-index:400;opacity:0;transition:opacity .3s;white-space:nowrap;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity = '0'; }, 2500);
}
</script>
